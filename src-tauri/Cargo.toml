[package]
name = "carteira-holder"
version = "0.1.0"
description = "Carteira Holder — controle e rebalanceamento de carteira de investimentos"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "carteira-holder"
path = "src/main.rs"
